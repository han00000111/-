name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Copy index to 404
        run: cp dist/index.html dist/404.html

      - name: Stamp debug page
        run: |
          if [ -f dist/debug.html ]; then
            sed -i "s|__DEPLOY_TIME__|$(date -u +'%Y-%m-%dT%H:%M:%SZ')|" dist/debug.html
          fi

      - name: Inspect dist artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/health.json
          test -f dist/snapshot.html
          test -d dist/assets
          find dist -maxdepth 2 -type f | sort
          grep -E '<script|<link' dist/index.html
          grep -q 'src="/-/assets/' dist/index.html
          grep -q 'href="/-/assets/' dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html
          ! grep -q 'src="/assets/' dist/index.html
          ! grep -q 'href="/assets/' dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
