name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Stamp debug page
        run: |
          node <<'NODE'
          const fs = require('fs')

          const index = fs.readFileSync('dist/index.html', 'utf8')
          const debugPath = 'dist/debug.html'

          if (fs.existsSync(debugPath)) {
            const scriptTag = index.match(/<script[^>]+src="[^"]+\.js"[^>]*><\/script>/)?.[0] || '未找到 JS 引用'
            const linkTag = index.match(/<link[^>]+href="[^"]+\.css"[^>]*>/)?.[0] || '未找到 CSS 引用'
            const jsPath = scriptTag.match(/src="([^"]+)"/)?.[1] || '未找到 JS 路径'
            const cssPath = linkTag.match(/href="([^"]+)"/)?.[1] || '未找到 CSS 路径'
            const escapeHtml = (value) => value
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('"', '&quot;')

            const debug = fs.readFileSync(debugPath, 'utf8')
              .replaceAll('__DEPLOY_TIME__', new Date().toISOString())
              .replaceAll('__JS_PATH__', escapeHtml(jsPath))
              .replaceAll('__CSS_PATH__', escapeHtml(cssPath))
              .replaceAll('__SCRIPT_TAG__', escapeHtml(scriptTag))
              .replaceAll('__LINK_TAG__', escapeHtml(linkTag))

            fs.writeFileSync(debugPath, debug)
          }
          NODE

      - name: Print built index
        run: sed -n '1,40p' dist/index.html

      - name: List dist
        run: find dist -maxdepth 2 -type f

      - name: Inspect dist artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/health.json
          test -f dist/snapshot.html
          test -d dist/assets
          find dist -maxdepth 2 -type f | sort
          grep -E '<script|<link' dist/index.html
          grep -q 'src="./assets/' dist/index.html
          grep -q 'href="./assets/' dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html
          ! grep -q 'src="/assets/' dist/index.html
          ! grep -q 'href="/assets/' dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
